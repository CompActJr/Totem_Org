worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 8m;
    gzip on;
    gzip_min_length 1000;
    gzip_comp_level 3;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        application/xml+rss
        image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    # Aponta para o nome do container do Nuxt na rede do Docker
    upstream nuxt {
        server totem-web:8000;
        keepalive 16;
    }

    # Aponta para o nome do container da API (ex: totem-api) na rede do Docker
    upstream api {
        server totem-api:9000; # Altere "totem-api" para o nome exato do seu container de API
        keepalive 16;
    }

    # Carrega automaticamente  os arquivos .conf dentro da pasta conf.d
    include /etc/nginx/conf.d/app.conf;
}
