worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Headers repassados para Nuxt e API (herdados pelos locations,
    # desde que o location não defina nenhum proxy_set_header próprio)
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    # Backends
    upstream nuxt {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    upstream api {
        # nginx no host: porta 9000 publicada só em localhost
        # (docker: "127.0.0.1:9000:9000"), então não fica exposta
        server 127.0.0.1:9000;
        # nginx em container na mesma rede docker: server backend-totem:9000;
        keepalive 16;
    }

    # Prefixo interno do Nuxt por subdomínio
    map $host $portal_prefix {
        colegios.soutotem.com.br      /colegios;
        vestibulares.soutotem.com.br  /vestibulares;
        on.soutotem.com.br            /on;
        default                       "";
    }

    # HTTP -> HTTPS
    server {
        listen 80;
        server_name soutotem.com.br www.soutotem.com.br
                    colegios.soutotem.com.br
                    vestibulares.soutotem.com.br
                    on.soutotem.com.br;

        return 301 https://$host$request_uri;
    }

    # Domínio principal: home, blog, admin
    server {
        listen 443 ssl;
        http2 on;
        server_name soutotem.com.br www.soutotem.com.br;

        ssl_certificate     /etc/letsencrypt/live/soutotem.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/soutotem.com.br/privkey.pem;

        # Evita conteúdo duplicado: /colegios/x -> colegios.soutotem.com.br/x
        location ~ ^/colegios(/.*)?$     { return 301 https://colegios.soutotem.com.br$1; }
        location ~ ^/vestibulares(/.*)?$ { return 301 https://vestibulares.soutotem.com.br$1; }
        location ~ ^/on(/.*)?$           { return 301 https://on.soutotem.com.br$1; }

        # API via proxy (porta 9000 não exposta)
        location /api/ {
            proxy_pass http://api;
        }

        location / {
            proxy_pass http://nuxt;
        }
    }

    # Portais: colegios, vestibulares e on (mesmo server, prefixo via map)
    server {
        listen 443 ssl;
        http2 on;
        server_name colegios.soutotem.com.br
                    vestibulares.soutotem.com.br
                    on.soutotem.com.br;

        ssl_certificate     /etc/letsencrypt/live/soutotem.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/soutotem.com.br/privkey.pem;

        # Assets do Nuxt: sem prefixo
        location ^~ /_nuxt/        { proxy_pass http://nuxt; }
        location ^~ /_ipx/         { proxy_pass http://nuxt; }
        location ^~ /__nuxt_error  { proxy_pass http://nuxt; }

        # API via proxy
        location /api/ {
            proxy_pass http://api;
        }

        # Todo o resto recebe o prefixo do portal, de forma invisível
        location / {
            rewrite ^ $portal_prefix$uri break;
            proxy_pass http://nuxt;
            # Se o Nuxt redirecionar para /colegios/..., remove o prefixo na resposta
            proxy_redirect ~^(https?://[^/]+)?$portal_prefix(/.*)?$ $1$2;
        }
    }
}