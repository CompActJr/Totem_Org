
services:
  mongoDb:
    image: mongo:7.0 
    container_name: totem-mongo
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    ports:
      - "127.0.0.1:27017:27017"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  backend-totem:
    image: totem-api:latest
    container_name: totem-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/www/uploads:/var/www/uploads
    networks:
      - app-network
    depends_on:
      mongoDb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 356m
          cpus: '0.5'
        reservations:
          memory: 128m
          cpus: '0.25'

  frontend-totem:
    image: totem-web:latest
    container_name: totem-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./frontend/.env
    networks:
      - app-network
    depends_on:
      backend-totem:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
        reservations:
          memory: 256m
          cpus: '0.25'

networks:
  app-network:
    name: app-network
    driver: bridge

volumes:
  mongo_data:
