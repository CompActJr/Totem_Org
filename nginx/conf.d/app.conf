
# Rejeita hosts desconhecidos
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name
    soutotem.com.br www.soutotem.com.br
    colegios.soutotem.com.br www.colegios.soutotem.com.br
    vestibulares.soutotem.com.br www.vestibulares.soutotem.com.br
    on.soutotem.com.br www.on.soutotem.com.br;

    # Necessário para emissão e renovação de certificados via Certbot webroot.
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Domínio principal
server {
    listen 443 ssl;
    http2 on;
    server_name soutotem.com.br www.soutotem.com.br;

    ssl_certificate /etc/letsencrypt/live/soutotem.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soutotem.com.br/privkey.pem;

    location ~ ^/colegios(/.*)?$ {
        return 301 https://colegios.soutotem.com.br$1$is_args$args;
    }
    location ~ ^/vestibulares(/.*)?$ {
        return 301 https://vestibulares.soutotem.com.br$1$is_args$args;
    }
    location ~ ^/on(/.*)?$ {
        return 301 https://on.soutotem.com.br$1$is_args$args;
    }

    location /api/ {
        proxy_pass http://api;
    }

    location = /health {
        proxy_pass http://api;
    }

    # O Fastify escreve no volume compartilhado; o Nginx entrega o arquivo sem
    # passar pelo Nuxt ou pela API.
    location ^~ /uploads/ {
        alias /var/www/uploads/;
        autoindex off;
        limit_except GET {
            deny all;
        }
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://nuxt;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name colegios.soutotem.com.br www.colegios.soutotem.com.br;

    ssl_certificate /etc/letsencrypt/live/soutotem.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soutotem.com.br/privkey.pem;

    location /api/ {
        proxy_pass http://api;
    }

    location ~ ^/(_nuxt|_ipx|__nuxt_error|favicon\.ico|robots\.txt|sitemap.*\.xml) {
        proxy_pass http://nuxt;
    }

    location ~ ^/(apoiadores|atividades|banners|cursos|geral|infraestrutura|logos|niveis|panoramas) {
        proxy_pass http://nuxt;
    }

    location / {
        rewrite ^ /colegios$uri break;
        proxy_pass http://nuxt;
    }
}

