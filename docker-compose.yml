
services:
  mongoDb:
    image: mongo:8.3.11-noble
    container_name: totem_mongo
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    mem_limit: 1g
    mem_reservation: 256m
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend-totem:
    image: totem-api:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - app-network
    depends_on:
      mongoDb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend-totem:
    image: totem-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./frontend/.env
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_API_BASE_INTERNAL: http://backend-totem:9000/api
    networks:
      - app-network
    depends_on:
      backend-totem:
        condition: service_healthy

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
