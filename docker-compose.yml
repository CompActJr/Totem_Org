
services:

  mongoDb:
    image: mongo:8.3.11-noble
    container_name: name
    ports:
      - "27017:27017"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  backend:
    image: totem-api:latest
    container_name: totem-api
    ports:
      - "9000:9000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  principal:
    image: totem-main:latest
    container_name: principal
    ports:
      - "8001:8001"
    env_file:
      - ./totem_main/.env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  colegios:
    image: totem-colegios:latest
    container_name: colegios
    ports:
      - "8002:8002"
    env_file:
      - ./totem_colegios_web/.env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  vestibulares:
    image: totem-vestibulares:latest
    container_name: vestibulares
    ports:
      - "8003:8003"
    env_file:
      - ./totem_vestibulares_web/.env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  nginx:
    image: nginx-totem:latest
    container_name: nginx-totem
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      - principal
      - colegios
      - vestibulares
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

volumes:
  mongo_data: