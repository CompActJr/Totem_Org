# Servidor padrão para qualquer acesso via IP ou host desconhecido
server {
    listen 80 default_server;
    server_name _;

    # Rota para os arquivos estáticos e assets do Nuxt (Necessário para carregar CSS/JS corretamente)
    location ~ ^/(_nuxt|_ipx|__nuxt_error|favicon\.ico|robots\.txt|sitemap.*\.xml) {
        proxy_pass http://nuxt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Rota principal apontando para o Nuxt
    location / {
        proxy_pass http://nuxt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
