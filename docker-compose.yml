
services:

  backend:
    image: totem-api:latest
    container_name: totem-api
    ports:
      -"9000:9000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512
        reservations:
          memory: 128

  principal:
    image: totem-main:latest
    container_name: principal
    ports:
      - "8001:8001"
    env_file:
      - ./totem_main/.env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512
        reservations:
          memory: 128

  colegios:
    image: totem-colegios:latest
    container_name: colegios
    ports:
      - "8002:8002"
    env_file:
      - ./totem_colegios_web/.env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512
        reservations:
          memory: 128

  vestibulares:
    image: totem-vestibulares:latest
    container_name: vestibulares
    ports:
      - "8003:8003"
    env_file:
      - ./totem_vestibulares_web/.env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512
        reservations:
          memory: 128

  nginx:
    image: nginx-totem:latest
    container_name: nginx-totem
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      - principal
      - colegios
      - vestibulares
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512
        reservations:
          memory: 128

volumes:
  mongo_data: