worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Enable gzip compression
    gzip on;

    # Minimum file size to compress (smaller files aren't worth it)
    gzip_min_length 1000;

    # Compression level (1-9, higher = more compression, more CPU)
    gzip_comp_level 5;

    # MIME types to compress
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        application/xml+rss
        image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    upstream nuxt {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    upstream api {
        server 127.0.0.1:9000;
        keepalive 16;
    }

    # Rejeita hosts desconhecidos
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        ssl_reject_handshake on;
        return 444;
    }

    # HTTP -> HTTPS
    server {
        listen 80;
        server_name soutotem.com.br www.soutotem.com.br
                    colegios.soutotem.com.br
                    vestibulares.soutotem.com.br
                    on.soutotem.com.br;
        return 301 https://$host$request_uri;
    }

    # Domínio principal
    server {
        listen 443 ssl http2;
        server_name soutotem.com.br www.soutotem.com.br;

        ssl_certificate     /etc/letsencrypt/live/soutotem.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/soutotem.com.br/privkey.pem;

        location ~ ^/colegios(/.*)?$     { return 301 https://colegios.soutotem.com.br$1$is_args$args; }
        location ~ ^/vestibulares(/.*)?$ { return 301 https://vestibulares.soutotem.com.br$1$is_args$args; }
        location ~ ^/on(/.*)?$           { return 301 https://on.soutotem.com.br$1$is_args$args; }

        location /api/ { proxy_pass http://api; }
        location /     { proxy_pass http://nuxt; }
    }

    server {
        listen 443 ssl http2;
        server_name colegios.soutotem.com.br www.colegios.soutotem.com.br;

        ssl_certificate     /etc/letsencrypt/live/soutotem.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/soutotem.com.br/privkey.pem;

        location /api/ {
            proxy_pass http://api;
        }

        location ~ ^/(_nuxt|_ipx|__nuxt_error|favicon\.ico|robots\.txt|sitemap.*\.xml) {
            proxy_pass http://nuxt;
        }

        location ~ ^/(apoiadores|atividades|banners|cursos|geral|infraestrutura|logos|niveis|panoramas) {
            proxy_pass http://nuxt;
        }

        location / {
            rewrite ^ /colegios$uri break;
            proxy_pass http://nuxt;
        }
    }

    server {
        listen 443 ssl http2;
        server_name vestibulares.soutotem.com.br www.vestibulares.soutotem.com.br;

        ssl_certificate     /etc/letsencrypt/live/soutotem.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/soutotem.com.br/privkey.pem;

       
        location /api/ {
            proxy_pass http://api;
        }

        location ~ ^/(_nuxt|_ipx|__nuxt_error|favicon\.ico|robots\.txt|sitemap.*\.xml) {
            proxy_pass http://nuxt;
        }

        location ~ ^/(apoiadores|atividades|banners|cursos|geral|infraestrutura|logos|niveis|panoramas) {
            proxy_pass http://nuxt;
        }

        location / {
            rewrite ^ /vestibulares$uri break;
            proxy_pass http://nuxt;
        }
    }

    server {
        listen 443 ssl http2;
        server_name on.soutotem.com.br www.on.soutotem.com.br;

        ssl_certificate     /etc/letsencrypt/live/soutotem.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/soutotem.com.br/privkey.pem;

        location /api/ {
            proxy_pass http://api;
        }

        location ~ ^/(_nuxt|_ipx|__nuxt_error|favicon\.ico|robots\.txt|sitemap.*\.xml) {
            proxy_pass http://nuxt;
        }

        location ~ ^/(apoiadores|atividades|banners|cursos|geral|infraestrutura|logos|niveis|panoramas) {
            proxy_pass http://nuxt;
        }

        location / {
            rewrite ^ /on$uri break;
            proxy_pass http://nuxt;
        }
    }
}